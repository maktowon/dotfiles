# yazi keymap — `~` or F1 inside yazi lists every binding
# prepend_keymap adds to the defaults instead of replacing them

[[mgr.prepend_keymap]]
on   = ["g", "."]
run  = "cd ~/dotfiles"
desc = "Go to dotfiles"

[[mgr.prepend_keymap]]
on   = ["g", "r"]
run  = 'shell -- ya emit cd "$(git rev-parse --show-toplevel)"'
desc = "Go to git root"

[[mgr.prepend_keymap]]
on   = "!"
run  = 'shell "$SHELL" --block'
desc = "Open a shell here (exit to return)"

[[mgr.prepend_keymap]]
on   = ["g", "w"]
run  = 'shell -- ya emit cd "${YAZI_START:-$HOME}"'
desc = "Go to the folder yazi was started from"

# swap q/Q: q leaves the shell where it was, Q cds the shell to where yazi ended (via y)
[[mgr.prepend_keymap]]
on   = "q"
run  = "quit --no-cwd-file"
desc = "Quit, stay in the original folder"

[[mgr.prepend_keymap]]
on   = "Q"
run  = "quit"
desc = "Quit and cd the shell to the current folder"
