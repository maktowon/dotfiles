console_title_template = '{{ .Shell }} in {{ .Folder }}'
version = 4
final_space = true

# ============================================================
# LEFT
# ============================================================

[[blocks]]
  type = 'prompt'
  alignment = 'left'
  newline = true
  leading_diamond = ''
  trailing_diamond = ''

  # USER
  [[blocks.segments]]
    type = 'session'
    style = 'diamond'
    foreground = '#ECEFF4'
    background = '#5E81AC'
    template = ' {{ .UserName }} '
    font_weight = 'bold'

    [blocks.segments.properties]
      leading_diamond = ''

  # PATH
  [[blocks.segments]]
    type = 'path'
    style = 'plain'
    foreground = '#2E3440'
    background = '#81A1C1'
    template = ' {{ .Path }} '

    [blocks.segments.properties]
      style = 'full'

  # GIT
  [[blocks.segments]]
    type = 'git'
    style = 'plain'
    foreground = '#2E3440'
    background = '#88C0D0'
    template = ' {{ .HEAD }}{{ if or (gt .Behind 0) (gt .Ahead 0) }} {{ end }}{{ if gt .Behind 0 }}⇣{{ .Behind }}{{ end }}{{ if gt .Ahead 0 }}⇡{{ .Ahead }}{{ end }}{{ if gt (add .Staging.Added (add .Staging.Modified .Staging.Deleted)) 0 }} +{{ add .Staging.Added (add .Staging.Modified .Staging.Deleted) }}{{ end }}{{ if gt .Working.Modified 0 }} !{{ .Working.Modified }}{{ end }}{{ if gt .Working.Deleted 0 }} −{{ .Working.Deleted }}{{ end }}{{ if gt .Working.Untracked 0 }} ?{{ .Working.Untracked }}{{ end }}{{ if gt .Working.Unmerged 0 }} ~{{ .Working.Unmerged }}{{ end }} '

    [blocks.segments.properties]
      fetch_status = true

  # ARROW
  [[blocks.segments]]
    type = 'text'
    style = 'diamond'
    foreground = '#2E3440'
    background = '#88C0D0'
    template = ' ❯'

    background_templates = [
      '{{ if .Segments.Contains "Git" }}#88C0D0{{ else }}#81A1C1{{ end }}'
    ]

    [blocks.segments.properties]
      trailing_diamond = ''

# ============================================================
# RIGHT
# ============================================================

[[blocks]]
  type = 'rprompt'
  alignment = 'right'

  # EXIT STATUS
  [[blocks.segments]]
    type = 'status'
    style = 'plain'
    foreground = '#A3BE8C'
    template = '{{ if .Executed }}{{ if eq .Code 0 }}✓{{ else }}✗{{ end }}{{ end }}'

    foreground_templates = [
      '{{ if gt .Code 0 }}#BF616A{{ end }}'
    ]

    [blocks.segments.properties]
      always_enabled = true

  # EXECUTION TIME
  [[blocks.segments]]
    type = 'executiontime'
    style = 'plain'
    foreground = '#D8DEE9'
    template = ' {{ .FormattedMs }} '

    [blocks.segments.properties]
      threshold = 500

  # CURRENT TIME
  [[blocks.segments]]
    type = 'time'
    style = 'plain'
    foreground = '#D8DEE9'
    template = ' {{ .CurrentDate | date .Format }}'

    [blocks.segments.properties]
      time_format = '15:04:05'

  # PYTHON
  [[blocks.segments]]
    type = 'python'
    style = 'diamond'
    foreground = '#2E3440'
    background = '#A3BE8C'
    template = ' Python {{ .Full }}{{ if .Venv }} ({{ .Venv }}){{ end }} '
    leading_diamond = ''
    trailing_diamond = ' '

    [blocks.segments.properties]
      display_mode = 'content'
      fetch_virtual_env = true
      display_default = false

  # NODE
  [[blocks.segments]]
    type = 'node'
    style = 'diamond'
    foreground = '#2E3440'
    background = '#B48EAD'
    template = ' Node {{ .Full }} '
    leading_diamond = ''
    trailing_diamond = ' '

    [blocks.segments.properties]
      display_mode = 'context'
  
  # GO
  [[blocks.segments]]
    type = 'go'
    style = 'diamond'
    foreground = '#2E3440'
    background = '#8FBCBB'
    template = ' Go {{ .Full }} '
    leading_diamond = ''
    trailing_diamond = ' '

    [blocks.segments.properties]
      display_mode = 'context'

  # RUST
  [[blocks.segments]]
    type = 'rust'
    style = 'diamond'
    foreground = '#2E3440'
    background = '#D08770'
    template = ' Rust {{ .Full }} '
    leading_diamond = ''
    trailing_diamond = ' '

    [blocks.segments.properties]
      display_mode = 'context'

  # JAVA
  [[blocks.segments]]
    type = 'java'
    style = 'diamond'
    foreground = '#ECEFF4'
    background = '#BF616A'
    template = ' Java {{ .Full }} '
    leading_diamond = ''
    trailing_diamond = ' '

    [blocks.segments.properties]
      display_mode = 'context'

  # RUBY
  [[blocks.segments]]
    type = 'ruby'
    style = 'diamond'
    foreground = '#ECEFF4'
    background = '#5E81AC'
    template = ' Ruby {{ .Full }} '
    leading_diamond = ''
    trailing_diamond = ' '

    [blocks.segments.properties]
      display_mode = 'context'

  # PHP
  [[blocks.segments]]
    type = 'php'
    style = 'diamond'
    foreground = '#2E3440'
    background = '#81A1C1'
    template = ' PHP {{ .Full }} '
    leading_diamond = ''
    trailing_diamond = ' '

    [blocks.segments.properties]
      display_mode = 'context'

  # DENO
  [[blocks.segments]]
    type = 'deno'
    style = 'diamond'
    foreground = '#ECEFF4'
    background = '#4C566A'
    template = ' Deno {{ .Full }} '
    leading_diamond = ''
    trailing_diamond = ' '

    [blocks.segments.properties]
      display_mode = 'context'


# ============================================================
# TRANSIENT PROMPT
# ============================================================

[transient_prompt]
  foreground = '#D8DEE9'
  template = '❯ '
  right_template = '{{ now | date "15:04:05" }}'
